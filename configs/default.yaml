# Default Configuration for Physical Living Standard Index (PLSI) Pipeline

project:
  name: "phys-living-index"
  version: "0.1.0"
  study_area: "jabodetabek_karawang"

spatial:
  # Greater Jakarta (Jabodetabek) + Karawang Regency Bounding Box: [min_lon, min_lat, max_lon, max_lat]
  # Eastward extension to 107.65 added to capture Karawang's industrial-labor-housing vs.
  # agrarian-hinterland disparity archetype. Karawang's eastern extent here is an estimate from
  # regency boundary points, not a verified admin polygon -- confirm against an authoritative
  # boundary (OSM relation or BPS) during Stage 2 ingestion before treating it as final.
  bbox: [106.35, -6.75, 107.65, -5.95]
  h3_resolution: 8 # ~0.737 km², edge length ~461m
  isochrone:
    network_mode: "walk"
    walking_speed_kmh: 4.0
    cutoff_minutes: 15
    cutoff_distance_meters: 1000

standards:
  un_habitat_min_living_space_m2: 9.0
  who_pm25_annual_threshold_ugm3: 15.0
  radiance_saturation_ceiling_nw: 15.0

features:
  dimensions: 6
  names:
    - "space_sufficiency_ratio"
    - "cumulative_amenities_15m"
    - "nighttime_energy_radiance"
    - "vegetation_ndvi"
    - "thermal_comfort_lst_inv"
    - "air_purity_pm25_inv"
  open_buildings:
    min_confidence: 0.65
    floor_height_meters: 3.0

model:
  architecture: "SpatialGATAutoencoder"
  in_channels: 6
  hidden_dim: 16
  latent_dim: 2
  heads: 2
  dropout: 0.1
  learning_rate: 0.005
  weight_decay: 0.0001
  epochs: 150
  loss_weights:
    reconstruction: 1.0
    graph_adjacency: 0.1

clustering:
  algorithm: "hdbscan"
  min_cluster_size: 25
  min_samples: 10
  metric: "euclidean"

validation:
  rwi:
    resolution_km: 2.4
  bps:
    level: "kabupaten_kota"
    min_correlation: 0.65
