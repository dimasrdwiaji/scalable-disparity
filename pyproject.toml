[project]
name = "phys-living-index"
version = "0.1.0"
description = "Scalable GeoAI framework for mapping and explaining micro-scale physical living standards and spatial disparity"
authors = [
    { name = "Dimas RD" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "geopandas>=1.0.0",
    "h3>=4.1.0",
    "pyarrow>=17.0.0",
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "hdbscan>=0.8.38",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "requests>=2.31.0",
    "fsspec>=2024.2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "python-dotenv>=1.0.0",
    "osmnx>=2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phys_living_index"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: marks tests as live integration tests requiring network (skipped by default)",
]
addopts = "-m 'not integration'"
